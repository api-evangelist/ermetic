name: Ermetic
description: 'Ermetic is a cloud security company founded in 2019 that pioneered
  cloud infrastructure entitlement management (CIEM) as part of a unified, identity-first
  cloud-native application protection platform (CNAPP) spanning AWS, Azure, and GCP.
  The platform provides full visibility into permissions and entitlements across
  multi-cloud environments, least-privilege and just-in-time access controls,
  anomaly detection against behavioral baselines, and compliance and cloud security
  posture management (CSPM). Ermetic raised roughly $100M from investors including
  Accel, Norwest Venture Partners, Glilot Capital Partners, and Target Global, and
  was acquired by Tenable in October 2023 for approximately $265M. The product now
  ships as Tenable Cloud Security; the ermetic.com domain redirects to Tenable, and
  the former Ermetic customer application (us.app.ermetic.com) exposes a login-gated
  REST API.'
